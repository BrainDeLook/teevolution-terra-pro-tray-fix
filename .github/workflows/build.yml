name: Build Windows patcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Build and package
        shell: pwsh
        run: ./Build.ps1
      - name: Compile local runtime test harness
        shell: pwsh
        run: |
          & "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:TrayTest.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll tests/TrayTest.cs
          if ($LASTEXITCODE -ne 0) { throw 'Test harness compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Teevolution-Terra-Pro-Tray-Fix
          path: Teevolution-Terra-Pro-Tray-Fix-v1.0.0.zip
